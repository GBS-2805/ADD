<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="790" viewBox="0 0 1300 790"><title>Pantone reference — review edition</title><desc>Every review-edition colour with its nearest Pantone Solid Coated chip, two alternatives, and the nearest textile TCX chip.</desc><rect width="1300" height="790" fill="#f0e7d4"/><text x="40" y="84" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="400" fill="#1B1212">Pantone reference</text><text x="40" y="118" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#5f5550">Nearest chip for every colour the review edition declares, and two alternatives for each.</text><text x="40" y="142" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5550">ΔE00 is CIEDE2000 distance from the screen colour: 0 is the same colour, under 3 is indistinguishable.</text><text x="40" y="162" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5550">Hex values are published conversions of Pantone&#x27;s own L*a*b* data - check a physical chip before printing.</text><text x="40" y="232" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#1B1212">Review edition</text><rect x="40" y="246" width="1220" height="1" fill="#1B121238"/><text x="124" y="266" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#5f5550">COLOUR</text><text x="340" y="266" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#5f5550">NEAREST PANTONE</text><text x="640" y="266" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#5f5550">ALTERNATIVE</text><text x="900" y="266" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#5f