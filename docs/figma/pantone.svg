<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="790" viewBox="0 0 1300 790"><title>Pantone reference — newsprint</title><desc>Every newsprint colour with its nearest Pantone Solid Coated chip, two alternatives, and the nearest textile TCX chip.</desc><rect width="1300" height="790" fill="#e9e0cb"/><text x="40" y="84" font-family="Poppins, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="400" fill="#15120e">Pantone reference</text><text x="40" y="118" font-family="Poppins, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#625b4f">Nearest chip for every colour the newsprint edition declares, and two alternatives for each.</text><text x="40" y="142" font-family="Poppins, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#625b4f">ΔE00 is CIEDE2000 distance from the screen colour: 0 is the same colour, under 3 is indistinguishable.</text><text x="40" y="162" font-family="Poppins, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#625b4f">Hex values are published conversions of Pantone&#x27;s own L*a*b* data - check a physical chip before printing.</text><text x="40" y="232" font-family="Poppins, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#15120e">Newsprint</text><rect x="40" y="246" width="1220" height="1" fill="#15120e3d"/><text x="124" y="266" font-family="Poppins, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#625b4f">COLOUR</text><text x="340" y="266" font-family="Poppins, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#625b4f">NEAREST PANTONE</text><text x="640" y="266" font-family="Poppins, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#625b4f">ALTERNATIVE</text><text x="900" y="266" font-family="Poppins, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#625b4f">ALTERNATIVE</text><rect x="40" y="284" width="52" height="52" rx="2" 