name: live drift

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check live security headers
        run: |
          ORIGIN="$(python3 -c 'import json; print(json.load(open("tools/site.json"))["url"])')"
          python3 tools/check_headers.py \
            --origin "$ORIGIN" \
            --handoff-origin https://artbase-handoff.vercel.app/
      - name: Compare the live bytes with main
        run: |
          ORIGIN="$(python3 -c 'import json; print(json.load(open("tools/site.json"))["url"])')"
          python3 tools/check_live.py \
            --origin "$ORIGIN" \
            --docs docs \
            --expect-commit "$(git rev-parse HEAD)" \
            --receipt live
