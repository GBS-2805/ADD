name: live drift

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check live security headers
        run: |
          ORIGIN="$(python3 -c 'import json; print(json.load(open("tools/site.json"))["url"])')"
          python3 tools/check_headers.py \
            --origin "$ORIGIN" \
            --handoff-origin https://artbase-handoff.vercel.app/
      - name: Compare the live bytes with main
        run: |
          ORIGIN="$(python3 -c 'import json; print(json.load(open("tools/site.json"))["url"])')"
          python3 tools/check_live.py \
            --origin "$ORIGIN" \
            --docs docs \
            --expect-commit "$(git rev-parse HEAD)" \
            --receipt live
