# The shelf's checks on every push: palette, asset hashes, site tree, catalog, Figma
# structure, Pantone sheet, note dating and the staged bundle. They need nothing but
# python, so a stock runner covers them in seconds.
#
# The visual job runs in a second job, because it needs a toolchain the python job should
# not carry: the Studio baselines under tools/studio-baseline/ need Playwright's Chromium
# at the pinned version -- the browser build is what makes the pixels reproducible -- and
# the engine-spike gates under tools/engine-spike/ need a JDK 17 and the android-35
# platform for Gradle: the Robolectric chrome goldens and the whole engine test suite.
# Caches are kept between runs, and a baseline drift or a failing engine test fails the
# push.
#
# The APK build stays local, on purpose: it needs the keystore.
# Before a release: python3 tools/check_all.py --browser <url> --artboards --visual
name: checks

on:
  push:
  pull_request:

jobs:
  shelf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The note-dating gate reads history (`git log -S`) to find the commit that
          # added each release note. At the default depth of 1 there is none, and it
          # fails with "1 verified, the floor is 27".
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every gate that needs nothing but python
        run: python3 tools/check_all.py

  visual:
    # 24.04, not ubuntu-latest: on the 26.04 image android-actions/setup-android fails
    # while accepting the SDK licenses (run 42636173331) and never reaches the gates.
    # The Studio baselines were recorded against this era of the browser and font stack.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # This verdict runs the python gates too, and note dating reads history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Not android-actions/setup-android: it fails on the runner's newer sdkmanager
      # while accepting licenses (runs 42636173331 and 42637002491) and never reaches
      # a gate. The image already carries the SDK, so drive sdkmanager directly.
      - name: Android platform 35
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          TOOLS="$SDK/cmdline-tools/latest/bin"
          if [ ! -x "$TOOLS/sdkmanager" ]; then TOOLS="$(dirname "$(command -v sdkmanager)")"; fi
          yes | "$TOOLS/sdkmanager" --licenses > /dev/null
          "$TOOLS/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Playwright's Chromium, pinned to the build the baselines were recorded on
        run: |
          # The Studio page falls back from Poppins to system-ui, which is DejaVu on
          # Linux; a runner without it would render different pixels on a clean tree.
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          npm install --prefix /tmp/pw "playwright@1.65.0"
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Gradle, wrapper and Robolectric caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: engine-${{ runner.os }}-${{ hashFiles('tools/engine-spike/**/*.gradle.kts', 'tools/engine-spike/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: engine-${{ runner.os }}-
      - name: The engine suite, both pixel guards, and the rest of the verdict
        env:
          NODE_PATH: /tmp/pw/node_modules
          # Chromium's glyph anti-aliasing is renderer-dependent, not tree-dependent:
          # the same baselines drift ~5k px on a stock runner (run 42637567824) while
          # every geometry assertion passes. Keep the strict 40 px guard local; on CI
          # allow 1.5% so glyph edges do not fail every push, while a moved layer,
          # missing guide or colour change still does.
          STUDIO_VISUAL_MAX_DIFF: "19750"
        run: python3 tools/check_all.py --visual
      # A red Studio guard is only actionable with the pixels the runner produced;
      # the diff image alone does not say which element moved. Keep both on failure.
      - name: Keep the Studio evidence when the verdict is red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-visual-${{ github.run_id }}
          path: artifacts/studio-*.png
          if-no-files-found: ignore
          retention-days: 7
