# The shelf's checks on every push: palette, asset hashes, site tree, catalog, Figma
# structure, Pantone sheet, note dating and the staged bundle. They need nothing but
# python, so a stock runner covers them in seconds.
#
# Two things stay local, on purpose:
#   * the APK build, which needs a JDK, the android-35 platform and the keystore;
#   * the Chromium halves -- `--browser <url>` and `--artboards` -- which need the
#     300 MB toolchain that tools/render_env.py builds.
# Before a release: python3 tools/check_all.py --browser <url> --artboards
name: checks

on:
  push:
  pull_request:

jobs:
  shelf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every gate that needs nothing but python
        run: python3 tools/check_all.py
