# The shelf's checks on every push: palette, asset hashes, internal links, site tree,
# catalog, Figma structure, Pantone sheet, note dating and the staged bundle. They need
# nothing but python, so a stock runner covers them in seconds.
#
# The visual job runs in a second job, because it needs a toolchain the python job should
# not carry: the engine-spike gates under tools/engine-spike/ need a JDK 17 and the
# android-35 platform for Gradle, the Robolectric chrome goldens and the whole engine
# test suite. Caches are kept between runs, and a baseline drift or a failing engine
# test fails the push.
#
# The editor job covers editor/ -- the app that builds the shelf's /editor/ page.
# It needs a Node toolchain, so it is separate from the python-only job.
#
# The APK build stays local, on purpose: it needs the keystore.
# Before a release: python3 tools/check_all.py --browser <url> --artboards --visual
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shelf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
          # The note-dating gate reads history (`git log -S`) to find the commit that
          # added each release note. At the default depth of 1 there is none, and it
          # fails with "1 verified, the floor is 27".
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Every gate that needs nothing but python
        run: python3 tools/check_all.py
      - name: Checker self-tests
        run: python3 -m unittest discover -s tools/tests -v

  editor:
    # editor/ builds the shelf's /editor/ page but sat outside every gate: 255 unit tests
    # that only ran when someone remembered. It gets its own job because the
    # typecheck alone takes about 45s on a cold cache and the shelf job should stay
    # a few seconds of python.
    #
    # 24.04 for the same reason the visual job pins it: `ubuntu-latest` is now 26.04
    # and Playwright 1.57 refuses to install a browser there ("Playwright does not
    # support chromium on ubuntu26.04-x64"), which failed the first run of this job.
    runs-on: ubuntu-24.04
    # npm ci (~40s) + typecheck (~45s cold) + vitest (~80s) + install the browser
    # (~30s) + 70 canvas specs (~3.5m) leaves room without hiding a hang.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install the pinned dependencies
        run: npm ci
        working-directory: editor
      - name: Typecheck, unit tests, assets and payload
        run: python3 tools/check_editor.py
      - name: Install the pinned browser
        run: npx --no-install playwright install --with-deps chromium
        working-directory: editor
      - name: The canvas specs against the built editor
        # TWIN_E2E_CI=1 skips *-captures.spec.ts (writes gitignored screenshots) and
        # the performance spec (a recorded 190 ms finding with its own plan). The
        # other 70 assertions gate the push: undo, snapping, export, .add round-trip,
        # every plugin opening, and no requests leaving the origin.
        run: npm run test:e2e:ci
        working-directory: editor
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editor-junit
          path: |
            test-results/editor-junit.xml
            editor/test-results/
          if-no-files-found: warn

  visual:
    # 24.04, not ubuntu-latest: on the 26.04 image android-actions/setup-android fails
    # while accepting the SDK licenses (run 42636173331) and never reaches the gates.
    # The Studio baselines were recorded against this era of the browser and font stack.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
          # This verdict runs the python gates too, and note dating reads history.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      # Not android-actions/setup-android: it fails on the runner's newer sdkmanager
      # while accepting licenses (runs 42636173331 and 42637002491) and never reaches
      # a gate. The image already carries the SDK, so drive sdkmanager directly.
      - name: Android platform 35
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          TOOLS="$SDK/cmdline-tools/latest/bin"
          if [ ! -x "$TOOLS/sdkmanager" ]; then TOOLS="$(dirname "$(command -v sdkmanager)")"; fi
          yes | "$TOOLS/sdkmanager" --licenses > /dev/null
          "$TOOLS/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Playwright's Chromium, pinned to the build the baselines were recorded on
        run: |
          npm install --prefix /tmp/pw "playwright@1.65.0"
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      # The artboards are byte-compared with baselines recorded against the rootless
      # render stack from tools/render_env.py: its pinned FreeType, fontconfig and
      # DejaVu/Liberation faces are part of the measurement, not just the browser.
      - name: Pinned render libraries and fonts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /tmp/pkgs
            /tmp/rootfs
          key: render-rootfs-${{ runner.os }}-${{ hashFiles('tools/render_env.py') }}
      - name: Rebuild the pinned render libraries and fonts
        run: python3 tools/render_env.py --libs
      - name: Gradle, wrapper and Robolectric caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: engine-${{ runner.os }}-${{ hashFiles('tools/engine-spike/**/*.gradle.kts', 'tools/engine-spike/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: engine-${{ runner.os }}-
      - name: The engine suite, both pixel guards, and the rest of the verdict
        env:
          NODE_PATH: /tmp/pw/node_modules
          LD_LIBRARY_PATH: /tmp/rootfs/usr/lib/x86_64-linux-gnu:/tmp/rootfs/lib/x86_64-linux-gnu
          FONTCONFIG_FILE: /tmp/rootfs/fonts.conf
        run: python3 tools/check_all.py --visual --artboards
  publish:
    needs: [shelf, visual]
    # A merge is not automatically a release. Put [skip publish] in the merge commit
    # message to land checked work on main without deploying it; the site then stays
    # on the previous release until a merge without the marker. The `handoff` job
    # needs this one, so it is skipped with it and cannot publish half a release.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip publish]')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: publish-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Deploy the checked main tree
        env:
          VERCEL_ARTBASE_TOKEN: ${{ secrets.VERCEL_ARTBASE_TOKEN }}
          # deploy_vercel.py runs the same strict storage gate before it uploads;
          # the token is stripped again before the Vercel CLI child is spawned.
          VERCEL_ADMIN_TOKEN: ${{ secrets.VERCEL_ADMIN_TOKEN }}
        run: |
          test -n "$VERCEL_ARTBASE_TOKEN"
          python3 tools/deploy_vercel.py
      - name: Check live site security headers
        run: |
          python3 tools/check_headers.py \
            --origin https://artbase-olive.vercel.app/
      - name: Record the storage report
        if: always()
        continue-on-error: true
        env:
          VERCEL_ADMIN_TOKEN: ${{ secrets.VERCEL_ADMIN_TOKEN }}
        run: |
          echo "### Deployment storage" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/deploy_storage.py --json >> "$GITHUB_STEP_SUMMARY" || \
            echo '{"status":"unavailable"}' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the deploy receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-receipt-${{ github.sha }}
          path: docs/_deploy.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarise the deployed commit
        if: always()
        run: |
          echo "### Publish" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- origin: https://artbase-olive.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- receipt: \`docs/_deploy.json\`" >> "$GITHUB_STEP_SUMMARY"

  # Kept out of `publish` on purpose: the site is already live by the time this runs.
  # A handoff failure must turn the workflow red without rolling back or failing the
  # publish job.
  handoff:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Write the published provenance
        run: |
          python3 tools/update_handoff.py \
            --commit "$GITHUB_SHA" \
            --deployed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --gates "shelf + visual"
      - name: Deploy the tracked handoff
        env:
          VERCEL_HANDOFF_TOKEN: ${{ secrets.VERCEL_HANDOFF_TOKEN }}
          # deploy_review.py gates the handoff on the same storage report;
          # the token is stripped again before the Vercel CLI child is spawned.
          VERCEL_ADMIN_TOKEN: ${{ secrets.VERCEL_ADMIN_TOKEN }}
        run: |
          test -n "$VERCEL_HANDOFF_TOKEN"
          python3 tools/deploy_review.py handoff
      - name: Check live handoff security headers
        run: |
          python3 tools/check_headers.py \
            --origin https://artbase-handoff.vercel.app/
      - name: Verify the handoff page and its local assets
        run: |
          python3 - <<'PY'
          import re
          import urllib.request

          base = "https://artbase-handoff.vercel.app"
          page = urllib.request.urlopen(base + "/", timeout=30).read().decode("utf-8")
          if "provenance" not in page and "Committed:" not in page:
              raise SystemExit("handoff page has no provenance line")
          paths = set()
          for match in re.findall(r'(?:href|src)="([^"]+)"', page):
              if match.startswith(("http://", "https://", "#", "mailto:", "data:")):
                  continue
              paths.add("/" + match.lstrip("./"))
          failed = []
          for path in sorted(paths):
              request = urllib.request.Request(base + path, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 200:
                          failed.append("%s -> %s" % (path, response.status))
              except Exception as exc:
                  failed.append("%s -> %s" % (path, exc))
          if failed:
              raise SystemExit("handoff assets failed: " + "; ".join(failed))
          print("handoff: %d local assets return 200" % len(paths))
          PY
      - name: Summarise the handoff
        if: always()
        run: |
          echo "### Handoff" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- origin: https://artbase-handoff.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "- handoff: ok" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- handoff: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Same-repo pull requests only. A fork never reaches the Vercel secret.
  review:
    needs: [shelf, visual, editor]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: review
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Deploy the review surface
        env:
          VERCEL_REVIEW_TOKEN: ${{ secrets.VERCEL_REVIEW_TOKEN }}
        run: |
          test -n "$VERCEL_REVIEW_TOKEN"
          python3 tools/deploy_review.py review
      - name: Comment the review URL and head SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR_NUMBER" --body \
            "Review build for ${HEAD_SHA}: https://artbase-review.vercel.app — the newest same-repo review replaces the previous one at this URL."
