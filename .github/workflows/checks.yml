# The shelf's checks on every push: palette, asset hashes, internal links, site tree,
# catalog, Figma structure, Pantone sheet, note dating and the staged bundle. They need
# nothing but python, so a stock runner covers them in seconds.
#
# The visual job runs in a second job, because it needs a toolchain the python job should
# not carry: the engine-spike gates under tools/engine-spike/ need a JDK 17 and the
# android-35 platform for Gradle, the Robolectric chrome goldens and the whole engine
# test suite. Caches are kept between runs, and a baseline drift or a failing engine
# test fails the push.
#
# The editor jobs cover editor/ -- the app that builds the shelf's /editor/ page.
# They need a Node toolchain, so they are separate from the python-only job: `editor`
# runs the unit and static verdict, `editor-e2e` the browser specs in two shards, and
# `editor-perf` the production drag budget alone on its runner.
#
# The APK build stays local, on purpose: it needs the keystore.
# Before a release: python3 tools/check_all.py --browser <url> --artboards --visual
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      confirm:
        description: Optional. Type publish to deploy production; leave blank for checks only
        required: false
        type: string
      expected_sha:
        description: Optional full 40-character commit SHA that must match main
        required: false
        type: string

permissions:
  contents: read

jobs:
  shelf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The note-dating gate reads history (`git log -S`) to find the commit that
          # added each release note. At the default depth of 1 there is none, and it
          # fails with "1 verified, the floor is 27".
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Every gate that needs nothing but python
        run: python3 tools/check_all.py
      - name: Checker self-tests
        run: python3 -m unittest discover -s tools/tests -v

  editor:
    # editor/ builds the shelf's /editor/ page but sat outside every gate: 255 unit tests
    # that only ran when someone remembered. It gets its own job because the
    # typecheck alone takes about 45s on a cold cache and the shelf job should stay
    # a few seconds of python.
    #
    # 24.04 for the same reason the visual job pins it: `ubuntu-latest` is now 26.04
    # and Playwright 1.57 refuses to install a browser there ("Playwright does not
    # support chromium on ubuntu26.04-x64"), which failed the first run of this job.
    runs-on: ubuntu-24.04
    # npm ci (~40s) + typecheck (~45s cold) + vitest (~80s). No browser here: the
    # specs live in editor-e2e and the production budget in editor-perf.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install the pinned dependencies
        run: npm ci
        working-directory: editor
      - name: Typecheck, unit tests, assets and payload
        run: python3 tools/check_editor.py
      - name: Keep the unit report
        # This job is the only one that writes test-results/editor-junit.xml: the
        # vitest run inside check_editor.py emits it. Playwright's reporter is
        # `list`, so the shards have no JUnit file and keep their traces instead.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-junit
          path: test-results/editor-junit.xml
          if-no-files-found: warn

  editor-e2e:
    # The browser specs, split across two runners so the job's wall time halves.
    # Sharding is not coverage: `npx playwright test --list --shard=N/2` for both
    # shards unions to exactly the unsharded list (92 tests in 8 files). Each shard
    # runs the same TWIN_E2E_CI=1 suite, which skips the *-captures.spec.ts writers,
    # and keeps the two-worker setting inside its runner. Two is the count the 4-5
    # minute suites were measured with; the browser now comes from a cache keyed on
    # the lockfile instead of a 6-8 minute cold download.
    #
    # 24.04 for the Playwright 1.57 browser refusal described on `editor`.
    # 20 minutes: a slow runner has measured 4-5 min of specs normally, up to
    # ~10 min when the dev server is slow, and the per-test budgets in
    # playwright.config.ts are what decide a failure; this only bounds a hung job.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install the pinned dependencies
        run: npm ci
        working-directory: editor
      - name: The pinned browser, from the cache when the lockfile has not moved
        # @playwright/test pins one Chromium revision and the lockfile hash changes
        # exactly when it does, so a hit is always the right build. Without the
        # cache this download plus its apt step took 6 to 8 minutes on a cold
        # runner and varied by minutes between the two shards.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browser-${{ runner.os }}-${{ hashFiles('editor/package-lock.json') }}
      - name: Install the pinned browser
        # A hit still runs; it verifies the revision and only the OS packages are
        # left to apt, which the runner image mostly has already.
        run: npx --no-install playwright install --with-deps chromium
        working-directory: editor
      - name: The canvas specs
        # TWIN_E2E_CI=1 skips *-captures.spec.ts (writes gitignored screenshots).
        # Undo, snapping, export, .add round-trip, every plugin opening, and no
        # requests leaving the origin still gate the push.
        run: npm run test:e2e:ci -- --shard=${{ matrix.shard }}/2
        working-directory: editor
      - name: Keep the traces
        # Playwright keeps traces and error context only for failures, so a green
        # shard uploads nothing and this step is a no-op. The historical
        # `editor-junit` name belongs to the `editor` job, which is the one that
        # runs the vitest JUnit reporter.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-e2e-${{ matrix.shard }}
          path: editor/test-results/
          if-no-files-found: warn

  editor-perf:
    # The production drag budget, alone on its runner. It stays out of the e2e job
    # because another browser competing for CPU turns a drag frame into a long task;
    # the performance config still runs one worker and builds the production bundle.
    # A canvas timeout (they cluster on the software-WebGL fallback) cannot hide the
    # drag profile now that this is its own job.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install the pinned dependencies
        run: npm ci
        working-directory: editor
      - name: The pinned browser, from the cache when the lockfile has not moved
        # Same cache as the e2e shards: this job measured the cold download at
        # 8 minutes before its 93-second budget ran, which is the cold-runner
        # variance the open-frame number has to be read against.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browser-${{ runner.os }}-${{ hashFiles('editor/package-lock.json') }}
      - name: Install the pinned browser
        # A hit still runs; it verifies the revision and only the OS packages are
        # left to apt, which the runner image mostly has already.
        run: npx --no-install playwright install --with-deps chromium
        working-directory: editor
      - name: The production drag budget
        # Builds the production bundle and runs the 20-layer drag with pointerup
        # included, isolated to one worker so another test cannot compete for CPU.
        run: npm run test:e2e:perf
        working-directory: editor
      - name: Keep the drag metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-perf
          path: editor/test-results/editor-perf.json
          if-no-files-found: warn

  visual:
    # 24.04, not ubuntu-latest: on the 26.04 image android-actions/setup-android fails
    # while accepting the SDK licenses (run 42636173331) and never reaches the gates.
    # The Studio baselines were recorded against this era of the browser and font stack.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # This verdict runs the python gates too, and note dating reads history.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      # Not android-actions/setup-android: it fails on the runner's newer sdkmanager
      # while accepting licenses (runs 42636173331 and 42637002491) and never reaches
      # a gate. The image already carries the SDK, so drive sdkmanager directly.
      - name: Android platform 35
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          TOOLS="$SDK/cmdline-tools/latest/bin"
          if [ ! -x "$TOOLS/sdkmanager" ]; then TOOLS="$(dirname "$(command -v sdkmanager)")"; fi
          yes | "$TOOLS/sdkmanager" --licenses > /dev/null
          "$TOOLS/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Playwright's Chromium, pinned to the build the baselines were recorded on
        run: |
          npm install --prefix /tmp/pw "playwright@1.65.0"
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      # The artboards are byte-compared with baselines recorded against the rootless
      # render stack from tools/render_env.py: its pinned FreeType, fontconfig and
      # DejaVu/Liberation faces are part of the measurement, not just the browser.
      - name: Pinned render libraries and fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/pkgs
            /tmp/rootfs
          key: render-rootfs-${{ runner.os }}-${{ hashFiles('tools/render_env.py') }}
      - name: Rebuild the pinned render libraries and fonts
        run: python3 tools/render_env.py --libs
      - name: Gradle, wrapper and Robolectric caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: engine-${{ runner.os }}-${{ hashFiles('tools/engine-spike/**/*.gradle.kts', 'tools/engine-spike/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: engine-${{ runner.os }}-
      - name: Texture calibration history
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/engine-spike/texture-history.jsonl
          key: texture-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: texture-history-${{ runner.os }}-
      - name: The engine suite, both pixel guards, and the rest of the verdict
        env:
          NODE_PATH: /tmp/pw/node_modules
          LD_LIBRARY_PATH: /tmp/rootfs/usr/lib/x86_64-linux-gnu:/tmp/rootfs/lib/x86_64-linux-gnu
          FONTCONFIG_FILE: /tmp/rootfs/fonts.conf
          TEXTURE_HISTORY: tools/engine-spike/texture-history.jsonl
        run: python3 tools/check_all.py --visual --artboards
  publish:
    needs: [shelf, visual]
    # A merge is not a release. Publishing is a manual dispatch of this workflow on
    # main with the literal confirmation `publish`; shelf and visual must come green
    # before this job. The `handoff` job needs this one, so it is skipped with it and
    # cannot publish half a release.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: publish-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Confirm the expected commit
        if: github.event.inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          case "$EXPECTED_SHA" in
            *[!0-9a-f]*|'') echo "::error::expected_sha must be a full lowercase 40-character SHA" >&2; exit 1 ;;
          esac
          if [ "${#EXPECTED_SHA}" -ne 40 ] || [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::expected_sha $EXPECTED_SHA does not match checked-out $GITHUB_SHA" >&2
            exit 1
          fi
          echo "confirmed $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy the checked main tree
        env:
          VERCEL_ARTBASE_TOKEN: ${{ secrets.VERCEL_ARTBASE_TOKEN }}
          # deploy_vercel.py runs the same strict storage gate before it uploads;
          # the token is stripped again before the Vercel CLI child is spawned.
          VERCEL_ADMIN_TOKEN: ${{ secrets.VERCEL_ADMIN_TOKEN }}
        run: |
          test -n "$VERCEL_ARTBASE_TOKEN"
          python3 tools/deploy_vercel.py
      - name: Check live site security headers
        run: |
          python3 tools/check_headers.py \
            --origin https://artbase-olive.vercel.app/
      - name: Record the storage report
        if: always()
        continue-on-error: true
        env:
          VERCEL_ADMIN_TOKEN: ${{ secrets.VERCEL_ADMIN_TOKEN }}
        run: |
          echo "### Deployment storage" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/deploy_storage.py --json >> "$GITHUB_STEP_SUMMARY" || \
            echo '{"status":"unavailable"}' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the deploy receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-receipt-${{ github.sha }}
          path: docs/_deploy.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarise the deployed commit
        if: always()
        run: |
          echo "### Publish" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- origin: https://artbase-olive.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- receipt: \`docs/_deploy.json\`" >> "$GITHUB_STEP_SUMMARY"

  # Kept out of `publish` on purpose: the site is already live by the time this runs.
  # A handoff failure must turn the workflow red without rolling back or failing the
  # publish job.
  handoff:
    needs: publish
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Write the published provenance
        run: |
          python3 tools/update_handoff.py \
            --commit "$GITHUB_SHA" \
            --deployed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --gates "shelf + visual"
      - name: Deploy the tracked handoff
        env:
          VERCEL_HANDOFF_TOKEN: ${{ secrets.VERCEL_HANDOFF_TOKEN }}
          # deploy_review.py gates the handoff on the same storage report;
          # the token is stripped again before the Vercel CLI child is spawned.
          VERCEL_ADMIN_TOKEN: ${{ secrets.VERCEL_ADMIN_TOKEN }}
        run: |
          test -n "$VERCEL_HANDOFF_TOKEN"
          python3 tools/deploy_review.py handoff
      - name: Check live handoff security headers
        run: |
          # The handoff deploy carries no site assets, so skip the hashed-asset probe here.
          python3 tools/check_headers.py \
            --origin https://artbase-handoff.vercel.app/ \
            --asset ""
      - name: Verify the handoff page and its local assets
        run: |
          python3 - <<'PY'
          import re
          import urllib.request

          base = "https://artbase-handoff.vercel.app"
          page = urllib.request.urlopen(base + "/", timeout=30).read().decode("utf-8")
          if "provenance" not in page and "Committed:" not in page:
              raise SystemExit("handoff page has no provenance line")
          paths = set()
          for match in re.findall(r'(?:href|src)="([^"]+)"', page):
              if match.startswith(("http://", "https://", "#", "mailto:", "data:")):
                  continue
              paths.add("/" + match.lstrip("./"))
          failed = []
          for path in sorted(paths):
              request = urllib.request.Request(base + path, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 200:
                          failed.append("%s -> %s" % (path, response.status))
              except Exception as exc:
                  failed.append("%s -> %s" % (path, exc))
          if failed:
              raise SystemExit("handoff assets failed: " + "; ".join(failed))
          print("handoff: %d local assets return 200" % len(paths))
          PY
      - name: Summarise the handoff
        if: always()
        run: |
          echo "### Handoff" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- origin: https://artbase-handoff.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "- handoff: ok" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- handoff: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Same-repo pull requests only. A fork never reaches the Vercel secret.
  review:
    needs: [shelf, visual, editor, editor-e2e, editor-perf]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: review
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Deploy the review surface
        env:
          VERCEL_REVIEW_TOKEN: ${{ secrets.VERCEL_REVIEW_TOKEN }}
        run: |
          test -n "$VERCEL_REVIEW_TOKEN"
          python3 tools/deploy_review.py review
      - name: Comment the review URL and head SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR_NUMBER" --body \
            "Review build for ${HEAD_SHA}: https://artbase-review.vercel.app — the newest same-repo review replaces the previous one at this URL."
