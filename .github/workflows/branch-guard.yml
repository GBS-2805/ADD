name: branch guard

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  merged:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse commits on a branch whose PR already merged
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/check_branch_state.py \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --base main \
            --token-env GITHUB_TOKEN
